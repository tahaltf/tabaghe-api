version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tabaghe_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: tabaghe
      POSTGRES_PASSWORD: tabaghe
      POSTGRES_DB: tabaghe

    ports:
      - "5432:5432"

    volumes:
      - tabaghe_pg:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabaghe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tabaghe_pg:
