# Auto-deploy backend on push to main (Gitea Actions).
# Prerequisites: act_runner registered + repo/org secrets (see comments below).
name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tabagheh-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy via SSH
        uses: https://gitea.com/actions/appleboy-ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /app/tabagheh
            DEPLOY_SERVICES=backend bash ./deploy.sh
