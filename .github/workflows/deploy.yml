name: Deploy (SSH)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/tabagheh
            if [ ! -f .env ]; then
              echo "Missing /var/www/tabagheh/.env on server (needed for POSTGRES_PASSWORD & DATABASE_URL)"
              exit 1
            fi
            ./deploy.sh
            # No TTY in GitHub Actions: force non-interactive exec
            docker compose exec -T tabagheh_api npx prisma migrate deploy

