name: Deploy (SSH)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI (test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        env:
          # prisma.config.ts requires DATABASE_URL even for `prisma generate`
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: Test
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npm test

  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /app/tabagheh
            if [ ! -f .env ]; then
              echo "Missing /app/tabagheh/.env on server"
              exit 1
            fi
            # If seller_crm migration was left failed (e.g. old UTF-8 BOM), clear it so migrate deploy can retry.
            docker compose run --rm --no-deps --entrypoint npx backend \
              prisma migrate resolve --rolled-back 20261021140000_seller_crm \
              >/tmp/seller_crm_resolve.log 2>&1 \
              || echo "seller_crm resolve skipped (already applied/absent)"
            DEPLOY_SERVICES=backend bash ./deploy.sh
